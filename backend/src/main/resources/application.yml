server:
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
    min-response-size: 1024
  servlet:
    context-path: /

spring:
  application:
    name: learnsphere-ai

  config:
    import: optional:file:./application-secret.properties,optional:file:./config/application-secret.properties,optional:file:./src/main/resources/application-secret.properties,optional:file:./backend/src/main/resources/application-secret.properties

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:learnsphere_ai}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      # Applied independently of the JDBC URL so profile/local URL overrides still create missing databases.
      data-source-properties:
        createDatabaseIfNotExist: ${DB_AUTO_CREATE:true}
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      # Use the current schema in the selected database, rather than the legacy schema.sql targeting chen.
      schema-locations: classpath:db/bootstrap/schema.sql
      encoding: UTF-8
      continue-on-error: false

  # ==========================================================================
  # 数据库迁移（Flyway）
  # ==========================================================================
  #
  # 职责划分：
  #   - db/bootstrap/schema.sql + DatabaseInitializer：存量结构（36 表基线 + 幂等 ALTER）
  #   - Flyway：自此之后的所有结构变更，版本化、可追踪、可回滚
  #
  # baseline-on-migrate / baseline-version：
  #   已有数据库没有 flyway_schema_history 表。若不设 baseline，
  #   Flyway 会拒绝在「非空库」上初始化并直接报错。
  #   设为 true 后，Flyway 会在首次运行时写入一条 baseline 记录（版本 1），
  #   表示「存量结构视为已应用」，随后只执行 V2 及以后的脚本。
  #
  #   这同时避免了重复执行：db/bootstrap/schema.sql 已经把 36 张表建好，
  #   若 Flyway 再跑一遍建表脚本会造成不必要的重复劳动与冲突风险。
  #
  # validate-on-migrate：
  #   校验已应用的脚本校验和。若有人改动了已发布的迁移脚本，启动时立即失败，
  #   而不是让各环境悄悄产生结构差异。
  #
  # out-of-order: false
  #   禁止乱序执行。版本号必须递增，避免分支合并时出现「先应用 V5 再应用 V4」
  #   这种难以复现的状态。
  # ==========================================================================
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: 存量结构基线（schema.sql + DatabaseInitializer）
    validate-on-migrate: true
    out-of-order: false
    # 迁移失败立即中断启动，避免带着不完整的结构对外提供服务
    fail-on-missing-locations: true
    encoding: UTF-8

  cache:
    type: caffeine
    caffeine:
      spec: initialCapacity=100,maximumSize=500,expireAfterWrite=10m

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 10000
    lettuce:
      pool:
        max-active: 8
        max-wait: -1
        max-idle: 8
        min-idle: 0

app:
  diagnostic:
    enabled: false
  security:
    # 安全修复（2026-03）：可信代理层数，用于安全解析客户端真实 IP。
    # 0（默认）= 不信任任何转发头，只使用 TCP 对端地址（IP 不可伪造）。
    # 若部署在 Nginx / 网关之后，请按实际层数设置，例如：
    #   客户端 -> Nginx -> 应用            => 1
    #   客户端 -> CDN -> Nginx -> 应用     => 2
    # 切勿盲目调大：把不可信跳数计入后，客户端可再次伪造 X-Forwarded-For 前缀。
    trusted-proxy-count: ${TRUSTED_PROXY_COUNT:0}

    # API 防爬限流（单机内存计数，重启即失效）
    #
    # max-requests-per-minute 原本硬编码为 60，是按「一个人手动点页面」估的，
    # 但管理后台一个页面加载就会并发请求十几个接口（统计、列表、配置、清理状态…），
    # 翻两页就超限，正常管理员会被当成爬虫封掉。故提高到 300 并改为可配置。
    #
    # block-duration-ms 原本硬编码 10 分钟，误判一次要干等十分钟且期间页面完全不可用。
    # 降到 1 分钟，既能拦住持续刷接口的脚本，又不至于误伤正常用户。
    anti-crawler:
      max-requests-per-minute: ${ANTI_CRAWLER_MAX_RPM:300}
      block-duration-ms: ${ANTI_CRAWLER_BLOCK_MS:60000}
  cors:
    # 开发环境允许 localhost/127.0.0.1 以及局域网私有网段访问，方便手机真机调试；生产环境请通过 CORS_ALLOWED_ORIGINS 覆盖
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,https://localhost:5173,https://localhost:5174,https://localhost:5175,https://localhost:5176,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,http://127.0.0.1:5176,https://127.0.0.1:5173,https://127.0.0.1:5174,https://127.0.0.1:5175,https://127.0.0.1:5176,http://192.168.*:*,https://192.168.*:*,http://10.*:*,https://10.*:*,http://172.16.*:*,https://172.16.*:*,http://172.17.*:*,https://172.17.*:*,http://172.18.*:*,https://172.18.*:*,http://172.19.*:*,https://172.19.*:*,http://172.20.*:*,https://172.20.*:*,http://172.21.*:*,https://172.21.*:*,http://172.22.*:*,https://172.22.*:*,http://172.23.*:*,https://172.23.*:*,http://172.24.*:*,https://172.24.*:*,http://172.25.*:*,https://172.25.*:*,http://172.26.*:*,https://172.26.*:*,http://172.27.*:*,https://172.27.*:*,http://172.28.*:*,https://172.28.*:*,http://172.29.*:*,https://172.29.*:*,http://172.30.*:*,https://172.30.*:*,http://172.31.*:*,https://172.31.*:*}

jasypt:
  encryptor:
    # 安全要求：禁止回退到 PBEWithMD5AndDES / NoIvGenerator（DES 已淘汰、无 IV）。
    # 密钥必须通过环境变量 JASYPT_PASSWORD 或 JVM 参数注入，不得硬编码。
    algorithm: ${JASYPT_ALGORITHM:PBEWITHHMACSHA512ANDAES_256}
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    key-obtention-iterations: 100000
    password: ${JASYPT_PASSWORD:}

voice-engine:
  enabled: ${VOICE_ENGINE_ENABLED:true}
  python-command: ${VOICE_ENGINE_PYTHON:python}
  script-path: ${VOICE_ENGINE_SCRIPT:edge_tts_lite.py}
  host: ${VOICE_ENGINE_HOST:127.0.0.1}
  port: ${VOICE_ENGINE_PORT:5010}
  startup-timeout-seconds: ${VOICE_ENGINE_STARTUP_TIMEOUT:20}
  auto-install-deps: ${VOICE_ENGINE_AUTO_INSTALL:true}
  requirements-path: ${VOICE_ENGINE_REQUIREMENTS:requirements-voice-lite.txt}
  install-timeout-seconds: ${VOICE_ENGINE_INSTALL_TIMEOUT:600}
  extra-python-path: ${VOICE_ENGINE_PYTHONPATH:}
  # 原生 WebSocket 兜底（排在 SAPI 之后）。微软 GEC v2 后大概率 403，可按需关闭。
  native-websocket-fallback: ${VOICE_ENGINE_NATIVE_WS:true}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.learnsphere.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-statement-timeout: 5
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: true
  token-style: uuid
  is-log: false

logging:
  level:
    com.learnsphere: debug
    com.baomidou.mybatisplus: debug
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'

ai:
  api-url: ${AI_API_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:qwen-turbo}
  tutor:
    history:
      retention-days: 30
      auto-cleanup: true
    cleanup:
      cron: "0 0 2 * * ?"
    purge:
      cron: "0 0 3 ? * SUN"

management:
  endpoints:
    web:
      base-path: /api/actuator
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
    metrics:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ai.request.latency: true
        frontend.api.latency: true
        frontend.route.latency: true
        frontend.web_vital: true
      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
        ai.request.latency: 0.5,0.9,0.95,0.99

# ============================================================
# LearnSphere 自定义配置
# ============================================================
learnsphere:
  metrics:
    # Prometheus 抓取 actuator 指标用的静态令牌，通过请求头 X-Metrics-Token 传入。
    #
    # 为什么需要：actuator 端点已加访问控制（ActuatorAccessFilter），
    # 但 Prometheus 没有用户会话，无法走 admin 登录。不配这个令牌，
    # 加完访问控制就等于把监控打断了。
    #
    # 生产部署时通过环境变量注入，例如：
    #   METRICS_TOKEN=（用 openssl rand -hex 32 生成）
    # 未配置时该通道自动关闭（只允许 admin 会话），不会变成人人可访问。
    token: ${METRICS_TOKEN:}