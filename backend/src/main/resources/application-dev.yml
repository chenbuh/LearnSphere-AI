# 开发环境配置
# 敏感信息请在 application-secret.properties 中配置

# dev 环境使用 8081，避免与本机其他项目（如 Orbit-Canvas，占用 8080）冲突。
# 如需恢复，可设置环境变量 SERVER_PORT=8080 覆盖，或删掉下面两行。
server:
  port: ${SERVER_PORT:8081}

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/learnsphere_ai?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  # 热更新配置
  devtools:
    restart:
      enabled: true
      additional-paths: src/main/java
      exclude: static/**,public/**,templates/**
    livereload:
      enabled: true

logging:
  level:
    com.learnsphere: debug

app:
  diagnostic:
    # 安全修复（2026-03）：诊断接口默认关闭。
    # 该接口即使已删除 SQL 执行与路径回显能力，仍会暴露系统内部状态，
    # 需要排查问题时请显式以 -Dapp.diagnostic.enabled=true 临时开启。
    enabled: ${APP_DIAGNOSTIC_ENABLED:false}

# 安全修复（2026-03）：移除硬编码的 Jasypt 解密密钥。
# 原硬编码密钥已随仓库公开，等同于公开密钥（值见安全审计报告 V3，已脱敏）。
# 现改为仅从环境变量注入；未设置时加密解密操作会明确失败，而非静默使用弱密钥。
jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:}

# 语音引擎配置
voice-engine:
  enabled: ${VOICE_ENGINE_ENABLED:true}
  python-command: ${VOICE_ENGINE_PYTHON:python}
  script-path: ${VOICE_ENGINE_SCRIPT:edge_tts_lite.py}
  host: ${VOICE_ENGINE_HOST:127.0.0.1}
  port: ${VOICE_ENGINE_PORT:5010}
  startup-timeout-seconds: ${VOICE_ENGINE_STARTUP_TIMEOUT:20}
  auto-install-deps: ${VOICE_ENGINE_AUTO_INSTALL:true}
  requirements-path: ${VOICE_ENGINE_REQUIREMENTS:requirements-voice-lite.txt}
  install-timeout-seconds: ${VOICE_ENGINE_INSTALL_TIMEOUT:600}
  extra-python-path: ${VOICE_ENGINE_PYTHONPATH:}
  # 原生 WebSocket 兜底（排在 SAPI 之后）。微软 GEC v2 后大概率 403，可按需关闭。
  native-websocket-fallback: ${VOICE_ENGINE_NATIVE_WS:true}


